<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">SPSS to Excel automated reporting workflow</title>
  <desc id="desc">A workflow overview showing an SPSS SAV file being read and processed with Python, then exported as a formatted Excel report.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111c33"/>
      <stop offset="100%" stop-color="#1b3555"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#56d6c8"/>
      <stop offset="100%" stop-color="#78a9ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="270" rx="22" fill="url(#panel)"/>
  <text x="52" y="48" fill="#8be4db" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="3">AUTOMATED SURVEY REPORTING</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="52" y="88" width="210" height="122" rx="14" fill="#243c5c" stroke="#527293"/>
    <text x="157" y="133" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="25">SPSS .sav</text>
    <text x="157" y="166" text-anchor="middle" fill="#c4d4e8" font-size="16">Survey dataset</text>
    <rect x="345" y="88" width="235" height="122" rx="14" fill="#203e57" stroke="#56d6c8"/>
    <text x="462" y="132" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="25">Python</text>
    <text x="462" y="163" text-anchor="middle" fill="#c4d4e8" font-size="16">pyreadstat · pandas</text>
    <rect x="665" y="88" width="240" height="122" rx="14" fill="#203e57" stroke="#78a9ff"/>
    <text x="785" y="132" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="23">Table engine</text>
    <text x="785" y="161" text-anchor="middle" fill="#c4d4e8" font-size="15">Counts · % · multi-response</text>
    <rect x="990" y="88" width="158" height="122" rx="14" fill="#1f493f" stroke="#65d6a5"/>
    <text x="1069" y="132" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="25">Excel</text>
    <text x="1069" y="163" text-anchor="middle" fill="#c4d4e8" font-size="16">Formatted report</text>
  </g>
  <g fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M275 149H328M315 137L328 149L315 161"/>
    <path d="M592 149H648M635 137L648 149L635 161"/>
    <path d="M917 149H973M960 137L973 149L960 161"/>
  </g>
  <text x="600" y="244" text-anchor="middle" fill="#9fb4cf" font-family="Arial, Helvetica, sans-serif" font-size="15">Workflow overview · not a screenshot of the application</text>
</svg>